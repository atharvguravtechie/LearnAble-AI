{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LearnAble-AI{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8faff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 12px 45px rgba(30, 50, 100, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            color: #5146e5;
            font-size: 30px;
            font-weight: 800;
        }

        .brand p {
            color: #777;
            margin-bottom: 0;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-primary {
            background: #5146e5;
            border-color: #5146e5;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #4035c7;
            border-color: #4035c7;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .auth-footer a {
            color: #5146e5;
            text-decoration: none;
            font-weight: 600;
        }

        .field-error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-label {
            font-weight: 600;
            margin-top: 12px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="auth-card">

        <div class="brand">
            <h1>LearnAble-AI</h1>
            <p>Your personal AI-powered learning companion</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
